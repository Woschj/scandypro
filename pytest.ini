[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# Warnungen sollen sichtbar bleiben - deshalb hier nur eine einzige, bewusst
# begruendete Ausnahme statt eines pauschalen Filters:
#
# SQLModel dekoriert AsyncSession.execute() mit @deprecated, um zur eigenen
# API session.exec() zu lenken. Das darunterliegende
# SQLAlchemy-session.execute() ist NICHT deprecated und verschwindet auch
# nicht - es ist die Standard-API von SQLAlchemy 2.0. Die Warnung ist damit
# ein Stil-Hinweis, keine drohende Inkompatibilitaet.
#
# Eine Umstellung aller 166 Aufrufstellen waere riskant statt nuetzlich:
# exec() liefert bei Ein-Entitaets-Selects direkt die Modellobjekte (ohne
# .scalars()), bei Mehrspalten-Selects dagegen weiterhin Rows - jede
# Aufrufstelle braeuchte eine Einzelfallentscheidung, und ein Fehlgriff
# aendert das Ergebnis still statt laut. Siehe
# tasks/codebase-audit/README.md, CA-007.
filterwarnings =
    ignore:(?s).*session\.exec\(\).*:DeprecationWarning

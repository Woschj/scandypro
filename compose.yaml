services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - scandypro_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Virenprüfung für Uploads (siehe app/core/virenscan.py, docs/BACKUP.md ist
  # davon unberührt). Bewusst hinter einem Profil: das Image lädt ~1 GB
  # Signaturen und wird für die reine Funktionsbewertung nicht gebraucht.
  # Aktivieren mit:
  #   docker compose --profile virenscan up -d
  # und in der .env CLAMAV_HOST=clamav setzen. Ohne CLAMAV_HOST ist die
  # Prüfung aus; sobald sie gesetzt ist, lehnt die App Uploads ab, wenn der
  # Scanner nicht erreichbar ist (fail closed).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["virenscan"]
    restart: unless-stopped
    volumes:
      - clamav_signaturen:/var/lib/clamav
    healthcheck:
      # Der erste Start dauert lange (Signatur-Download), daher großzügige
      # start_period - sonst gilt der Dienst als ungesund, bevor er fertig ist.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - scandypro_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Standard: TLS-los, per IP/lokal erreichbar (Caddyfile ohne Domain).
      # Bei Umstellung auf eine echte Domain mit automatischem HTTPS (siehe
      # caddy/Caddyfile.domain-example) diese Zeile ersetzen durch:
      #   - "80:80"
      #   - "443:443"
      # Bei selbstsigniertem HTTPS fürs interne Netz ohne Domain (siehe
      # caddy/Caddyfile.internal-tls-example) stattdessen:
      #   - "${APP_HTTPS_PORT:-8443}:8443"
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  scandypro_db_data:
  scandypro_uploads:
  clamav_signaturen:
  caddy_data:
  caddy_config:

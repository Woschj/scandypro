services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - scandypro_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - scandypro_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Standard: TLS-los, per IP/lokal erreichbar (Caddyfile ohne Domain).
      # Bei Umstellung auf eine echte Domain mit automatischem HTTPS (siehe
      # caddy/Caddyfile.domain-example) diese Zeile ersetzen durch:
      #   - "80:80"
      #   - "443:443"
      # Bei selbstsigniertem HTTPS fürs interne Netz ohne Domain (siehe
      # caddy/Caddyfile.internal-tls-example) stattdessen:
      #   - "${APP_HTTPS_PORT:-8443}:8443"
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  scandypro_db_data:
  scandypro_uploads:
  caddy_data:
  caddy_config:
